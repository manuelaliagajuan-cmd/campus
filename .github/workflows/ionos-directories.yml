name: Revisar carpetas para el campus

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ionos-connection-check
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preparar cliente SSH
        run: python -m pip install --disable-pip-version-check paramiko==4.0.0

      - name: Consultar carpetas sin modificarlas
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: |
          python - <<'PY'
          import os, socket, hashlib, base64, hmac, paramiko
          host = os.environ.get("IONOS_HOST", "").strip()
          user = os.environ.get("IONOS_USER", "").strip()
          password = os.environ.get("IONOS_PASSWORD", "")
          expected = "SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q"
          if not all([host, user, password]):
              raise SystemExit("Falta alguno de los secretos IONOS.")
          transport = None
          command = """
          if [ -w . ]; then printf 'Directorio inicial: escribible\n'; else printf 'Directorio inicial: no escribible\n'; fi
          for d in CampusCEC public campus-cec; do
            if [ -d "$d" ]; then
              printf '%s: existe\n' "$d"
              if [ -w "$d" ]; then printf '%s: escribible\n' "$d"; fi
              if [ -f "$d/wp-config.php" ]; then printf '%s: contiene WordPress\n' "$d"; fi
              if [ -f "$d/artisan" ]; then printf '%s: contiene Laravel\n' "$d"; fi
            else
              printf '%s: no existe en el directorio inicial\n' "$d"
            fi
          done
          """
          try:
              transport = paramiko.Transport(socket.create_connection((host, 22), timeout=20))
              transport.start_client(timeout=20)
              key = transport.get_remote_server_key()
              actual = "SHA256:" + base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip("=")
              if not hmac.compare_digest(actual, expected):
                  raise SystemExit("La huella SSH cambió; no se ha enviado la contraseña.")
              transport.auth_password(user, password, fallback=False)
              channel = transport.open_session(timeout=20)
              channel.settimeout(30)
              channel.exec_command(command)
              output = bytearray()
              while True:
                  chunk = channel.recv(4096)
                  if not chunk:
                      break
                  output.extend(chunk)
                  if len(output) > 16384:
                      raise SystemExit("Respuesta inesperadamente larga.")
              status = channel.recv_exit_status()
              allowed = {"Directorio inicial: escribible", "Directorio inicial: no escribible"}
              for directory in ["CampusCEC", "public", "campus-cec"]:
                  for result in ["existe", "escribible", "contiene WordPress", "contiene Laravel", "no existe en el directorio inicial"]:
                      allowed.add(directory + ": " + result)
              lines = [line for line in output.decode("utf-8", errors="replace").splitlines() if line in allowed]
              print("\n".join(lines))
              if status != 0 or not lines:
                  raise SystemExit("La inspección no terminó correctamente.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("## Carpetas del alojamiento\n\n" + "\n".join("- " + line for line in lines) + "\n\nConsulta de solo lectura: no se han creado ni modificado carpetas, archivos o bases de datos.\n")
          except paramiko.AuthenticationException:
              raise SystemExit("IONOS rechazó la autenticación.")
          except (OSError, paramiko.SSHException):
              raise SystemExit("No se pudo completar la consulta SSH.")
          finally:
              if transport:
                  transport.close()
          PY
