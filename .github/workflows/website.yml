name: Publicar cambios revisados en cecalicante.es
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-connection-check
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --disable-pip-version-check paramiko==4.0.0
      - name: Publicar conservando copia y verificando contenido
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: python scripts/deploy_website.py
