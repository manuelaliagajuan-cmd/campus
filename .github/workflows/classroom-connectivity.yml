name: Comprobar transmisión TURN real de Speakyu
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-connection-check
  cancel-in-progress: false
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --disable-pip-version-check paramiko==4.0.0
      - name: Verificar claves guardadas sin mostrarlas
        env:
          CEC_CONNECTIVITY_FIXTURE: ${{ runner.temp }}/cec-turn-test.json
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: python scripts/check-speakyu-relay.py
      - name: Comprobar audio y vídeo sintéticos por TURN TLS 443
        env:
          CEC_CONNECTIVITY_FIXTURE: ${{ runner.temp }}/cec-turn-test.json
        run: |
          npm install --prefix "$RUNNER_TEMP/cec-browser" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/cec-browser/node_modules/.bin/playwright" install --with-deps chromium
          export CEC_PLAYWRIGHT_PATH="$RUNNER_TEMP/cec-browser/node_modules/playwright/index.mjs"
          node tests/browser/speakyu-relay.mjs
      - name: Retirar credenciales temporales de la prueba
        if: always()
        run: rm -f -- "$RUNNER_TEMP/cec-turn-test.json"
