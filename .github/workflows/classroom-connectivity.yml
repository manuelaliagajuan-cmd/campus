name: Configurar el TURN existente para Speakyu
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-connection-check
  cancel-in-progress: false
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --disable-pip-version-check paramiko==4.0.0
      - name: Configurar el relay en el espacio privado de Speakyu
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: python scripts/link-speakyu-turn.py
