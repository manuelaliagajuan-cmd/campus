name: Comprobar e instalar Campus CEC
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preparar PHP y Composer
        run: |
          php -v
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Pruebas de aplicación
        run: |
          php artisan test
          php artisan view:cache
          node --check public/assets/campus.js
          node --check public/assets/presentations.js
          node --check public/assets/course-cover-editor.js
          node --check public/assets/audio-picker.js
          node --check public/assets/online-classroom.js
          node --check public/assets/class-schedule.js
          node --check public/assets/store.js
          node --check public/assets/teacher-availability.js
          node --check public/assets/teacher-schedule.js
          node --check public/assets/profile-appearance.js
          node --check public/assets/profile-editor.js
          node --check public/assets/rtc-connectivity-check.js
      - name: Probar aula con dos navegadores y medios WebRTC reales
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/classroom.sqlite
          CEC_BROWSER_FIXTURE: ${{ runner.temp }}/classroom-fixture.json
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force
          php tests/browser/seed.php
          npm install --prefix "$RUNNER_TEMP/cec-browser" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/cec-browser/node_modules/.bin/playwright" install --with-deps chromium
          (cd public && php -S 127.0.0.1:8782 "$GITHUB_WORKSPACE/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php") > "$RUNNER_TEMP/classroom-php.log" 2>&1 &
          export CEC_PLAYWRIGHT_PATH="$RUNNER_TEMP/cec-browser/node_modules/playwright/index.mjs"
          node tests/browser/classroom.mjs
      - name: Probar vídeo y recuperación mediante TURN TCP
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/classroom.sqlite
          CEC_BROWSER_FIXTURE: ${{ runner.temp }}/classroom-fixture.json
          CEC_RTC_ICE_SERVERS: '[{"urls":"turn:127.0.0.1:3479?transport=tcp","username":"campus-test","credential":"local-test-password"}]'
        run: |
          sudo apt-get install -y --no-install-recommends coturn
          turnserver -n --no-cli --no-tls --no-dtls --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=3479 --min-port=49160 --max-port=49200 --lt-cred-mech --realm=campus-test --user=campus-test:local-test-password --allow-loopback-peers --no-multicast-peers --log-file="$RUNNER_TEMP/coturn.log" --pidfile="$RUNNER_TEMP/coturn.pid" > "$RUNNER_TEMP/coturn-console.log" 2>&1 &
          (cd public && php -S 127.0.0.1:8783 "$GITHUB_WORKSPACE/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php") > "$RUNNER_TEMP/classroom-relay-php.log" 2>&1 &
          export CEC_PLAYWRIGHT_PATH="$RUNNER_TEMP/cec-browser/node_modules/playwright/index.mjs"
          CEC_FORCE_RELAY=1 CEC_BROWSER_URL=http://127.0.0.1:8783 node tests/browser/classroom.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: classroom-debug
          path: |
            ${{ runner.temp }}/online-class-*.png
            ${{ runner.temp }}/classroom-php.log
            ${{ runner.temp }}/classroom-relay-php.log
            ${{ runner.temp }}/coturn*.log
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ionos-connection-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preparar dependencias de producción
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          python -m pip install --disable-pip-version-check paramiko==4.0.0
      - name: Instalar en directorio independiente
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          IONOS_DB_HOST: ${{ secrets.IONOS_DB_HOST }}
          IONOS_DB_NAME: ${{ secrets.IONOS_DB_NAME }}
          IONOS_DB_USER: ${{ secrets.IONOS_DB_USER }}
          IONOS_DB_PASSWORD: ${{ secrets.IONOS_DB_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CEC_RTC_ICE_SERVERS: ${{ secrets.CEC_RTC_ICE_SERVERS }}
          CEC_MAIL_HOST: ${{ secrets.CEC_MAIL_HOST }}
          CEC_MAIL_USER: ${{ secrets.CEC_MAIL_USER }}
          CEC_MAIL_PASSWORD: ${{ secrets.CEC_MAIL_PASSWORD }}
          CEC_MAIL_PORT: ${{ secrets.CEC_MAIL_PORT }}
          CEC_MAIL_FROM: ${{ secrets.CEC_MAIL_FROM }}
        run: python scripts/deploy_ionos.py
