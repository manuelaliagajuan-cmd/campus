<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212a5e"><title>CEC · Tu nivel de español</title>
<style>
:root{font-family:system-ui,sans-serif;color:#20294c;background:#f5f6fa;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#212a5e;color:white;padding:20px max(6vw,20px);display:flex;justify-content:space-between;align-items:center}header small{color:#cbd1eb}main{max-width:920px;margin:45px auto;padding:0 20px 50px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;letter-spacing:-1px}h2{line-height:1.3}p{color:#58617a}.eyebrow{color:#5063a4;font-weight:700;font-size:.8rem;letter-spacing:2px}.card{background:white;border:1px solid #dce0ec;border-radius:18px;padding:28px;margin:20px 0;box-shadow:0 8px 25px #212a5e06}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button,.button{font:inherit;cursor:pointer;border:1px solid #ccd2e3;background:white;color:#212a5e;padding:12px 18px;border-radius:10px;text-decoration:none;display:inline-block}button.primary{background:#212a5e;color:white;border-color:#212a5e}button:hover{border-color:#5063a4;background:#edf0fa}button.primary:hover{background:#35427b}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c17a28;outline-offset:4px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.level{text-align:left;min-height:110px}.level strong{display:block;font-size:1.35rem}.level span{font-size:.85rem;color:#58617a}.muted{font-size:.9rem}progress{width:100%;height:12px;accent-color:#354884}fieldset{border:0;padding:0;margin:20px 0}legend{font-size:1.3rem;font-weight:650;margin-bottom:18px;white-space:pre-line}label.option{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid #dce0ec;border-radius:10px;margin:10px 0;cursor:pointer}label:has(input:checked){background:#eef1fc;border-color:#5063a4}input{accent-color:#212a5e}input[type=radio]{width:18px;height:18px;flex-shrink:0}.notice{padding:14px;border-radius:10px;background:#eef1fc}.error{color:#a32236}.correct{color:#19613d}.score{font-size:3rem;font-weight:750;color:#212a5e}.review{padding:16px 0;border-bottom:1px solid #e6e8f0}.review p{margin:6px 0}footer{font-size:.85rem;color:#58617a;margin-top:24px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}main{margin-top:28px}.card{padding:20px}header small{display:none}.actions button{flex:1}}
</style></head><body><header><strong>CEC <span style="font-weight:400">/ Campus de español</span></strong><a href="/campus" style="color:white">Volver al campus</a></header><main id="campus" tabindex="-1"></main>
<script>
const bank={"A1": [["Hola, me ___ Ana.", ["llamo", "llama", "llamas"], 0, "Con «yo» usamos «me llamo»."], ["María ___ de España.", ["está", "es", "tiene"], 1, "«Ser de» expresa procedencia."], ["Tengo dos ___.", ["hermano", "hermanos", "hermanas pequeño"], 1, "Después de «dos» necesitamos un sustantivo en plural."], ["¿___ años tienes?", ["Qué", "Cuántos", "Cómo"], 1, "Preguntamos la edad con «¿Cuántos años tienes?»."], ["En mi habitación ___ una cama.", ["está", "es", "hay"], 2, "«Hay» introduce la existencia de algo."], ["Lee: «La biblioteca abre de lunes a viernes, de 9 a 14». ¿Cuándo puedes ir?", ["El sábado a las 10", "El martes a las 11", "El lunes a las 17"], 1, "El martes está entre lunes y viernes, y las 11 entre las 9 y las 14."]], "A2": [["Ayer ___ al cine con mis amigos.", ["voy", "fui", "iba a ir mañana"], 1, "«Ayer» sitúa una acción terminada en el pasado: «fui»."], ["Cuando era pequeño, ___ en Valencia.", ["viviré", "he vivido mañana", "vivía"], 2, "El imperfecto describe situaciones habituales del pasado."], ["Este libro es ___ interesante que aquel.", ["más", "muy", "mucho"], 0, "La comparación se forma con «más… que»."], ["No hay leche. ___ comprar un litro.", ["Hay", "Hay que", "Tiene"], 1, "«Hay que + infinitivo» expresa necesidad."], ["¿Quieres las llaves? Sí, ___ necesito.", ["los", "le", "las"], 2, "«Las» sustituye a «las llaves», femenino plural."], ["Lee: «Se alquila piso amueblado. No se admiten mascotas». ¿Qué es correcto?", ["El piso incluye muebles", "Puedes llevar un perro", "El piso está en venta"], 0, "«Amueblado» significa que tiene muebles; el anuncio ofrece alquiler."]], "B1": [["Espero que mañana ___ buen tiempo.", ["hace", "hará", "haga"], 2, "«Espero que» expresa un deseo y exige subjuntivo."], ["Si tuviera más tiempo, ___ otro idioma.", ["aprendería", "aprendo", "aprenderé"], 0, "La condición hipotética combina imperfecto de subjuntivo y condicional."], ["Cuando llegué, la película ya ___.", ["empezará", "había empezado", "empiece"], 1, "El pluscuamperfecto expresa una acción anterior a otra del pasado."], ["Estudio español ___ trabajar en Alicante.", ["por", "para", "desde"], 1, "«Para» introduce la finalidad."], ["___ estaba cansado, terminé el trabajo.", ["Aunque", "Porque", "Por eso"], 0, "«Aunque» introduce una dificultad que no impide la acción."], ["Lee: «El tren se ha cancelado. Los billetes serán válidos para el siguiente servicio». ¿Qué puede hacer el viajero?", ["Comprar obligatoriamente otro billete", "Utilizar su billete en el siguiente tren", "Pedir que salga el tren cancelado"], 1, "El aviso permite utilizar el billete en el siguiente servicio."]], "B2": [["No creo que esa decisión ___ adecuada.", ["es", "será", "sea"], 2, "«No creo que» normalmente introduce subjuntivo."], ["Te prestaré el coche con tal de que me lo ___ mañana.", ["devuelves", "devuelvas", "devolvías"], 1, "«Con tal de que» establece una condición con subjuntivo."], ["Ojalá te ___ caso ayer.", ["hubiera hecho", "haré", "hago"], 0, "Un deseo irreal sobre el pasado se expresa con pluscuamperfecto de subjuntivo."], ["El informe es extenso; ___, resulta fácil de leer.", ["por tanto", "sin embargo", "puesto que"], 1, "«Sin embargo» establece un contraste entre extensión y facilidad de lectura."], ["Cuando llegues, ya ___ la reunión.", ["habrá terminado", "terminaba", "terminase"], 0, "El futuro perfecto expresa una acción completada antes de un momento futuro."], ["Lee: «El teletrabajo ahorra desplazamientos, si bien puede diluir los límites entre vida personal y laboral». El autor…", ["rechaza totalmente el teletrabajo", "presenta una ventaja y una reserva", "afirma que no ahorra tiempo"], 1, "«Si bien» introduce una reserva tras reconocer una ventaja."]], "C1": [["De haberlo sabido, no ___.", ["vendré", "habría venido", "vengo"], 1, "«De haber + participio» puede expresar una condición irreal del pasado."], ["Por muy convincente que ___, conviene contrastar sus datos.", ["parezca", "parecerá", "parece siempre"], 0, "Esta construcción concesiva admite subjuntivo para presentar una valoración no afirmada."], ["La propuesta no prosperó, ___ contaba con apoyos suficientes.", ["de ahí que", "habida cuenta de que no", "a fin de que"], 1, "«Habida cuenta de que» introduce la razón; aquí faltaban apoyos."], ["«El director hizo caso omiso de las advertencias» significa que…", ["las ignoró", "las siguió", "las pidió por escrito"], 0, "«Hacer caso omiso» significa no prestar atención."], ["Buscamos a alguien que ___ traducir textos jurídicos. No tenemos candidato todavía.", ["sabe", "sepa", "supo"], 1, "El referente todavía no identificado favorece el subjuntivo."], ["Lee: «La medida, presentada como provisional, lleva una década vigente». ¿Qué sugiere el contraste?", ["Que duró unos días", "Que su duración contradice su carácter anunciado", "Que nunca llegó a aplicarse"], 1, "La permanencia durante diez años cuestiona la etiqueta de provisional."]], "C2": [["«No dejó de ser una solución de compromiso» implica que la solución…", ["era perfecta para todas las partes", "permitía un acuerdo mediante concesiones", "fue una promesa incumplida"], 1, "Una «solución de compromiso» concilia posiciones mediante concesiones."], ["«A buenas horas, mangas verdes», ante una ayuda tardía, expresa…", ["agradecimiento entusiasta", "reproche por llegar tarde", "deseo de cambiar de ropa"], 1, "Esta expresión reprocha que algo llegue cuando ya no resulta útil."], ["«No es que me oponga, sino que albergo ciertas reservas» comunica…", ["una aceptación sin condiciones", "cautela sin rechazo frontal", "una prohibición expresa"], 1, "Se matiza la postura: no hay oposición abierta, pero sí dudas."], ["Elige la opción de registro formal más precisa: «Su intervención ___ el conflicto: lo hizo más intenso».", ["soslayó", "zanjó", "recrudeció"], 2, "«Recrudecer» significa intensificar o agravar."], ["Lee: «El portavoz celebró la transparencia del proceso, aunque declinó facilitar los documentos que la acreditarían». ¿Qué se pone de relieve?", ["Una tensión entre su afirmación y su conducta", "Que se publicaron todos los documentos", "Que no hubo portavoz"], 0, "La negativa a aportar pruebas contrasta con la transparencia proclamada."], ["«Huelga decir que el acuerdo requiere unanimidad» equivale a…", ["Está prohibido decirlo", "Resulta innecesario decirlo por ser evidente", "Hay que suspender el acuerdo"], 1, "«Huelga decir» señala que algo es obvio o sobradamente conocido."]]};
const levels=Object.keys(bank), names=['Inicial','Básico','Intermedio','Intermedio alto','Avanzado','Dominio'];
const root=document.querySelector('#campus');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='',questions=[],answers=[],position=0;
function show(html){root.innerHTML=html;root.focus();}
function home(){show(`<p class="eyebrow">APRENDE · PRACTICA · DESCUBRE</p><h1>Tu español empieza aquí.</h1><p>Descubre por dónde empezar o repasa a tu ritmo con ejercicios de gramática, vocabulario y comprensión lectora.</p><section class="card"><h2>¿Qué nivel de español tienes?</h2><p>36 preguntas, de A1 a C2 · Aproximadamente 15–20 minutos · Sin límite de tiempo.</p><p class="notice">Prueba breve y orientativa, sin validez certificadora. No evalúa comprensión auditiva ni expresión oral o escrita. Un profesor debe completar la valoración.</p><button class="primary" data-start="test">Comenzar prueba de nivel</button></section><section aria-labelledby="practice"><h2 id="practice">Practica por nivel</h2><p>6 ejercicios por nivel, con respuestas y explicaciones al terminar.</p><div class="grid">${levels.map((l,i)=>`<button class="level" data-start="${l}"><strong>${l}</strong><span>${names[i]} · 6 ejercicios</span></button>`).join('')}</div></section><footer>No se solicitan datos personales. Las respuestas duran solo mientras esta página permanezca abierta.</footer>`);}
function start(value){mode=value;questions=(value==='test'?levels:[value]).flatMap(l=>bank[l].map((q,i)=>({level:l,id:i,prompt:q[0],options:q[1],correct:q[2],explanation:q[3]})));answers=Array(questions.length).fill(null);position=0;question();}
function question(){const q=questions[position];show(`<p class="eyebrow">${mode==='test'?'PRUEBA ORIENTATIVA':'PRÁCTICA '+mode}</p><p>Pregunta ${position+1} de ${questions.length} · Nivel ${q.level}</p><progress value="${position}" max="${questions.length}" aria-label="Preguntas completadas"></progress><form id="exercise" class="card"><fieldset><legend>${escapeHTML(q.prompt)}</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[position]===i?'checked':''}><span>${escapeHTML(o)}</span></label>`).join('')}<label class="option"><input type="radio" name="answer" value="-1" ${answers[position]===-1?'checked':''}><span>No lo sé</span></label></fieldset><p id="validation" class="error" role="alert"></p><div class="actions">${position?'<button type="button" data-back>Anterior</button>':''}<button class="primary" type="submit">${position===questions.length-1?'Ver resultado':'Siguiente'}</button><button type="button" data-exit>Salir</button></div></form>`);}
function result(){const rows=(mode==='test'?levels:[mode]).map(l=>{const indices=questions.map((q,i)=>q.level===l?i:-1).filter(i=>i>=0);return {level:l,correct:indices.filter(i=>answers[i]===questions[i].correct).length,total:indices.length};});const total=rows.reduce((s,r)=>s+r.correct,0);let reached=-1;for(const r of rows){if(r.correct<5)break;reached=levels.indexOf(r.level);}const estimate=reached<0?'Inicio de A1':levels[reached];show(`<p class="eyebrow">${mode==='test'?'TU PUNTO DE PARTIDA':'PRÁCTICA COMPLETADA'}</p><h1>${mode==='test'?'Resultado orientativo: '+estimate:'Has terminado '+mode}</h1><section class="card"><div class="score">${total} / ${questions.length}</div><p>Respuestas correctas</p>${mode==='test'?'<p class="notice">La referencia es el nivel más alto con al menos 5 de 6 aciertos en cada bloque, desde A1 y sin saltos. Es un criterio interno orientativo, no una equivalencia validada con el MCER. Coméntalo con tu profesor antes de elegir curso.</p>':''}<div class="grid">${rows.map(r=>`<div><strong>${r.level}</strong><p>${r.correct} / ${r.total} aciertos</p></div>`).join('')}</div><div class="actions"><button data-home>Volver al inicio</button><button data-start="${mode==='test'?(reached<0?'A1':levels[Math.min(reached+1,5)]):mode}">Practicar ${mode==='test'?(reached<0?'A1':levels[Math.min(reached+1,5)]):mode}</button><button data-print>Imprimir resultado</button></div></section><section class="card"><h2>Revisa tus respuestas</h2>${questions.map((q,i)=>`<div class="review"><strong>${i+1}. ${escapeHTML(q.prompt)}</strong><p class="${answers[i]===q.correct?'correct':'error'}">${answers[i]===q.correct?'Correcto':'Por repasar'} · Tu respuesta: ${answers[i]===-1?'No lo sé':escapeHTML(q.options[answers[i]])}</p><p><strong>Respuesta correcta:</strong> ${escapeHTML(q.options[q.correct])}</p><p>${escapeHTML(q.explanation)}</p></div>`).join('')}</section>`);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.start)start(b.dataset.start);else if(b.hasAttribute('data-back')){const checked=root.querySelector('input:checked');if(checked)answers[position]=Number(checked.value);position--;question();}else if(b.hasAttribute('data-home'))home();else if(b.hasAttribute('data-exit')){if(confirm('¿Salir de la prueba? Se perderán tus respuestas.'))home();}else if(b.hasAttribute('data-print'))window.print();});
root.addEventListener('submit',e=>{e.preventDefault();const checked=root.querySelector('input:checked');if(!checked){root.querySelector('#validation').textContent='Selecciona una respuesta o «No lo sé» para continuar.';return;}answers[position]=Number(checked.value);if(position===questions.length-1)result();else{position++;question();}});
home();
</script></body></html>
